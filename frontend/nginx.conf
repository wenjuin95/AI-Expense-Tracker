server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Exact match for the root path (catches the frequent pings)
    location = / {
        access_log off;
        try_files $uri $uri/ /index.html;
    }

    # Handles all other application routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
